name: Tests

# Runs the headless tests (tests/run.sh) on a real NWNX server, in Docker: on every pull request, every change to
# main, every night, by hand ("Run workflow"), and as the first step of a release (release.yml). Needs no secrets.
#
# Which tests (chapter 6, tier 3, switched on below): a pull request runs only the tests its change can affect
# (tests/tools/plan.py); everything else, the nightly run and every release included, runs them all. They are
# split into lanes, each its own job with its own server, and a test that fails is run once more on a fresh
# server: if it passes then, the run passes but says FLAKY, and the record goes into the flake report. The job
# called "tests" at the end is the one to require in your ruleset: it is red when any lane failed.
#
# Where (chapter 8, tier 3): on GitHub's machines, or on your own runners when the repository variable CI_RUNNER
# names them, such as ["self-hosted","nwn"]. A pull request from a fork always goes to GitHub's machines.
#
# If your module uses haks, set NWSYNC_URL below to your download address (chapter 7). The tests then get the haks
# and the talk table from it, the way a player's game does, each version downloaded once and kept: in GitHub's
# cache on GitHub's machines, in a folder on the machine itself on your own runners.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: Only these tests (names, or prefixes ending in _, separated by commas)
        default: t_
  workflow_call:

# A new push to a pull request stops its older run. Nothing else is stopped: a run by hand, the nightly run and a
# push to main each finish, whichever came first.
concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NASHER_VERSION: "1.2.2"
  NEVERWINTER_VERSION: "2.3.2"
  # The same image your server runs, and the same as in compile-check.yml.
  NWNX_IMAGE: nwnxee/unified:ed79330
  # Your download address, such as https://nwsync.example.org, or empty if your module uses no haks.
  NWSYNC_URL: ""
  # Tier 3 (chapter 6). TEST_SELECT: a pull request runs only the tests its change can affect. TEST_LANES: at
  # most this many lanes, with at least TEST_LANE_LEAST tests in each (a server takes about 12 s to start, so a
  # lane of one test is mostly waiting). TEST_RETRY: a failed test runs once more on a fresh server.
  TEST_SELECT: "false"
  TEST_LANES: "1"
  TEST_LANE_LEAST: "4"
  TEST_RETRY: "false"

jobs:
  plan:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Which tests
        id: plan
        env:
          FILTER: ${{ inputs.filter }}
          BASE: ${{ github.event_name == 'pull_request' && env.TEST_SELECT == 'true' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$FILTER" ] && [ "$FILTER" != t_ ]; then
            echo "by hand: $FILTER"
            jq -rn --arg f "$FILTER" '"mode=select", "lanes=" + ({include: [{lane: 1, filter: $f, boot: false}]} | tojson)' >> "$GITHUB_OUTPUT"
          else
            python3 tests/tools/plan.py ${BASE:+--base "$BASE"} --lanes "$TEST_LANES" --least "$TEST_LANE_LEAST" \
              --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lane:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    name: lane ${{ matrix.lane }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nwn-tools
        with:
          nasher-version: ${{ env.NASHER_VERSION }}
          neverwinter-version: ${{ env.NEVERWINTER_VERSION }}
          nwnx-image: ${{ env.NWNX_IMAGE }}

      # NWN_CONTENT_CACHE is set on your own runners (runners.sh): a folder on the machine, shared by every runner.
      - name: Which content to test with
        id: content
        if: env.NWSYNC_URL != ''
        run: |
          set -o pipefail
          tests/tools/fetch_content.sh --which "$NWSYNC_URL" | tee -a "$GITHUB_OUTPUT"
          echo "machine=$([ -n "${NWN_CONTENT_CACHE:-}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # On your own runners: one folder per version. A version is moved into place only once it is whole, so a lane
      # never reads one half-downloaded by another.
      - name: The content, from the machine's own cache
        if: steps.content.outputs.machine == 'true'
        env:
          VERSION: ${{ steps.content.outputs.version }}
        run: |
          dir=$NWN_CONTENT_CACHE/$VERSION
          if [ -f "$dir/version" ]; then
            echo "content $VERSION: already on this machine"; touch "$dir"
          else
            new=$(mktemp -d "$NWN_CONTENT_CACHE/.new-XXXXXX")
            tests/tools/fetch_content.sh "$NWSYNC_URL" "$new" "$VERSION"
            mv -T "$new" "$dir" 2>/dev/null || rm -rf "$new"
          fi
          echo "TEST_HAK_DIR=$dir/hak" >> "$GITHUB_ENV"; echo "TEST_TLK_DIR=$dir/tlk" >> "$GITHUB_ENV"

      # On GitHub's machines. A version's name is the checksum of its list of files, so a cached one can't be stale.
      - name: The content from GitHub's cache
        id: cache
        if: steps.content.outputs.machine == 'false'
        uses: actions/cache/restore@v6
        with:
          path: tests/.content
          key: nwsync-${{ steps.content.outputs.version }}

      - name: Download the content
        if: steps.content.outputs.machine == 'false' && steps.cache.outputs.cache-hit != 'true'
        run: tests/tools/fetch_content.sh "$NWSYNC_URL" tests/.content "${{ steps.content.outputs.version }}"

      # Saved straight away, not at the end, so a run whose tests fail doesn't download it all again next time.
      - name: Keep the content in the cache
        if: steps.content.outputs.machine == 'false' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/.content
          key: nwsync-${{ steps.content.outputs.version }}

      - name: Run the tests
        env:
          TEST_LANE: ${{ matrix.lane }}
          FILTER: ${{ matrix.filter }}
          BOOT: ${{ matrix.boot }}
        # pipefail: without it the step takes tee's exit status, and a failed test would pass the run.
        run: |
          set -o pipefail
          if [ -n "$NWSYNC_URL" ] && [ -z "${TEST_HAK_DIR:-}" ]; then
            export TEST_HAK_DIR=$PWD/tests/.content/hak TEST_TLK_DIR=$PWD/tests/.content/tlk
          fi
          if [ "$BOOT" = true ]; then which=(--boot-only); else which=(--filter "$FILTER"); fi
          [ "$TEST_RETRY" != true ] || which+=(--retry)
          tests/run.sh "${which[@]}" | tee "$RUNNER_TEMP/results.txt"

      - name: Show the results on the run's page
        if: always()
        run: |
          { echo "### Lane ${{ matrix.lane }}"; echo '```'; cat "$RUNNER_TEMP/results.txt" 2>/dev/null || echo "no results"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-lane-${{ matrix.lane }}
          path: tests/.run/
          # .run starts with a dot, and upload-artifact leaves out hidden files unless told: without this line
          # nothing at all is kept.
          include-hidden-files: true
          retention-days: 14

  # The one check to require: green when every lane passed, or when no lane was needed.
  tests:
    needs: [plan, lane]
    if: always()
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Gather the lanes' records
        if: needs.lane.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: test-logs-lane-*
          path: lanes

      - name: Flaky and quarantined tests
        id: flakes
        run: |
          cat lanes/*/flakes.jsonl > flakes.jsonl 2>/dev/null || true
          if [ -s flakes.jsonl ]; then
            { echo "### Flaky or quarantined"; echo '```'; jq -r '"\(.kind)  \(.test)  lane \(.lane): \(.why)"' flakes.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # What the flake report reads: kept for 30 days, so the report can look two weeks back.
      - name: Keep the flake records
        if: steps.flakes.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flakes
          path: flakes.jsonl
          retention-days: 30

      - name: Every lane passed
        env:
          PLAN: ${{ needs.plan.result }}
          LANES: ${{ needs.lane.result }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          echo "plan: $PLAN, mode: $MODE, lanes: $LANES"
          [ "$PLAN" = success ] && { [ "$LANES" = success ] || { [ "$LANES" = skipped ] && [ "$MODE" = none ]; }; }
