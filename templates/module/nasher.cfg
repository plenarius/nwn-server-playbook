# What nasher needs to know about this module. https://github.com/squattingmonk/nasher

[package]
name = "My module"
description = "A Neverwinter Nights module, kept as text"
version = "0.1.0"
author = "Your Name <you@example.org>"

  [package.sources]
  include = "src/**/*.{nss,json}"

  # Where "nasher unpack" puts each kind of file.
  [package.rules]
  "*" = "src/$ext"

[target]
name = "default"
description = "The whole module"
# The file "nasher pack" builds. The server loads it by this name, without the ".mod".
file = "mymodule.mod"
