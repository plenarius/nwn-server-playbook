# InfluxDB 1.x, the store for the game's numbers (NWNX's Metrics_InfluxDB plugin). Chapter 13, tier 3.
# The game sends its numbers over UDP to 8089, the way the plugin speaks; Grafana reads them over HTTP on 8086,
# inside this Compose project only.
reporting-disabled = true

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  # The index on disk rather than in memory: the profiler makes many series (one per script, area and event).
  index-version = "tsi1"
  query-log-enabled = false

[http]
  enabled = true
  bind-address = ":8086"
  log-enabled = false

[[udp]]
  enabled = true
  bind-address = ":8089"
  # Into the database's default retention policy, "raw" (init.iql).
  database = "nwn"
  batch-size = 5000
  batch-timeout = "1s"

[monitor]
  # InfluxDB's statistics about itself, in a database of their own. Off: they would take more room than the game.
  store-enabled = false
