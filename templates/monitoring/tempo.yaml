# Tempo, the trace store, as one process with its files on local disk. Chapter 13, tier 3.
# Services send traces over OTLP (HTTP 4318, gRPC 4317); Grafana reads them on 3200.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# How long traces are kept. A trace answers "why was that one call slow, just now"; three days is plenty.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h
backend_worker:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
