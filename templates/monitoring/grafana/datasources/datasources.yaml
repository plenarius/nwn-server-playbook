# The three stores, by their names inside this Compose project. Chapter 13, tier 3.
apiVersion: 1
datasources:
  - name: InfluxDB
    uid: nwn-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: nwn
      httpMode: GET
    isDefault: true
  - name: Loki
    uid: nwn-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
  - name: Tempo
    uid: nwn-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a trace to the logs of the same service and minute.
      tracesToLogsV2:
        datasourceUid: nwn-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: false
