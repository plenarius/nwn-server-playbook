# Loki, the log store, as one process with its files on local disk. Chapter 13, tier 3.
# The game host's log shipper (templates/game/logs.alloy) pushes to it on 3100; Grafana reads from it there too.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# How long logs are kept, and the compactor that removes older ones. Without retention_enabled, Loki keeps
# everything forever, whatever retention_period says.
limits_config:
  retention_period: 336h          # 14 days
  ingestion_rate_mb: 4            # a game server writes far less; this only stops a runaway
  ingestion_burst_size_mb: 8
  max_query_lookback: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
