<!-- The header your website, forum and wiki share (chapter 11, tier 3). Change the name, the addresses and the
     links; keep the links absolute, because the forum and the wiki show this on their own addresses. Each site
     puts its own "Sign in" or the member's name where the comment inside shell-user is. -->
<header class="shell" role="banner">
  <a class="shell-name" href="https://www.example.org/">My World</a>
  <nav class="shell-nav" aria-label="Sites">
    <a href="https://www.example.org/">Home</a>
    <a href="https://www.example.org/status">Status</a>
    <a href="https://forum.example.org/">Forum</a>
    <a href="https://wiki.example.org/">Wiki</a>
  </nav>
  <span class="shell-user"><!--shell-user--></span>
</header>
