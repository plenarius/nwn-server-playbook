# The website's web server (chapter 11, tier 2): your pages as files, plus /status.json, which asks the operations
# API on the visitor's behalf. It replaces the nginx image's own nginx.conf.

load_module modules/ngx_http_js_module.so;

# The two settings status.js reads. nginx hides the environment from its workers unless it is named here.
env OPS_API_URL;
env OPS_API_TEAM_KEY;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;
    gzip          on;
    gzip_types    application/json text/css application/javascript image/svg+xml;

    js_import status from /etc/nginx/status.js;
    # How long status.js waits for the API. The status answer takes a second or two (it looks at the game host
    # over SSH); more than this and the page says it can't tell.
    js_fetch_timeout 10s;

    # One small cache for the status answer, kept a day so there is a last-known answer to fall back on.
    proxy_cache_path /var/cache/nginx/status levels=1 keys_zone=status:1m max_size=10m inactive=1d use_temp_path=off;

    server {
        listen 80;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        location = /status.json {
            proxy_pass http://127.0.0.1:8081/status;
            proxy_cache status;
            proxy_cache_key status;            # one answer for everyone: the query string can't make a new one
            proxy_cache_valid 200 30s;
            proxy_cache_valid any 10s;         # an error too, so a down API isn't asked on every visit
            proxy_cache_lock on;               # many visitors at once still make one call
            proxy_cache_lock_timeout 15s;
            # If the API fails, keep serving the last good answer; the page shows how old it is.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            # Browsers and Cloudflare may keep it as long as this server does, and no longer.
            add_header Cache-Control "public, max-age=30" always;
            add_header X-Status-Cache $upstream_cache_status always;
        }
    }

    # Only nginx itself can reach this: it is where status.js runs, behind the cache above.
    server {
        listen 127.0.0.1:8081;
        location = /status {
            js_content status.status;
        }
    }
}
