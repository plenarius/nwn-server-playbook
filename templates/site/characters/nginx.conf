# The website's web server with the status page (chapter 11, tier 2) and character pages (chapter 11, tier 3):
# your pages as files, plus /status.json and /characters/*.json, which ask the operations API on the visitor's
# behalf. It replaces the nginx.conf of the status page.

load_module modules/ngx_http_js_module.so;

# The two settings status.js and characters.js read. nginx hides the environment from its workers unless it is
# named here.
env OPS_API_URL;
env OPS_API_READ_KEY;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;
    gzip          on;
    gzip_types    application/json text/css application/javascript image/svg+xml;

    js_import status from /etc/nginx/status.js;
    js_import characters from /etc/nginx/characters.js;
    # How long the scripts wait for the API. A status or a character sheet takes a second or two (the API looks at
    # the game host over SSH); more than this and the page says it can't tell.
    js_fetch_timeout 10s;

    # Small caches for the API's answers, kept a day so there is a last-known answer to fall back on.
    proxy_cache_path /var/cache/nginx/status levels=1 keys_zone=status:1m max_size=10m inactive=1d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/characters levels=1 keys_zone=characters:1m max_size=50m inactive=1d use_temp_path=off;

    server {
        listen 80;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        location = /status.json {
            proxy_pass http://127.0.0.1:8081/status;
            proxy_cache status;
            proxy_cache_key status;            # one answer for everyone: the query string can't make a new one
            proxy_cache_valid 200 30s;
            proxy_cache_valid any 10s;         # an error too, so a down API isn't asked on every visit
            proxy_cache_lock on;               # many visitors at once still make one call
            proxy_cache_lock_timeout 15s;
            # If the API fails, keep serving the last good answer; the page shows how old it is.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            # Browsers and Cloudflare may keep it as long as this server does, and no longer.
            add_header Cache-Control "public, max-age=30" always;
            add_header X-Status-Cache $upstream_cache_status always;
        }

        # The list of characters, and one character's sheet. Five minutes: a character changes when it levels up
        # or changes clothes, not by the second. A name that isn't listed is kept a minute, so guessing names
        # can't keep the API busy.
        location = /characters.json {
            proxy_pass http://127.0.0.1:8081/characters;
            proxy_cache characters;
            proxy_cache_key characters;
            proxy_cache_valid 200 5m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Status-Cache $upstream_cache_status always;
        }

        location ~ "^/characters/(?<slug>[a-z0-9-]{1,40})\.json$" {
            proxy_pass http://127.0.0.1:8081/character/$slug;
            proxy_cache characters;
            proxy_cache_key character:$slug;
            proxy_cache_valid 200 5m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Status-Cache $upstream_cache_status always;
        }

        # A character's page, /characters/<name>: one page for all of them, which asks for its own .json. (A
        # pattern with { } in it must be in quotes.)
        location ~ "^/characters/[a-z0-9-]{1,40}$" {
            try_files /character.html =404;
        }
    }

    # Only nginx itself can reach this: it is where the scripts run, behind the caches above.
    server {
        listen 127.0.0.1:8081;
        location = /status {
            js_content status.status;
        }
        location = /characters {
            js_content characters.list;
        }
        location ~ "^/character/(?<slug>[a-z0-9-]{1,40})$" {
            js_content characters.one;
        }
    }
}
