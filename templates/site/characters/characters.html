<!doctype html>
<!--
  The characters of your world that have a page (chapter 11, tier 3): those listed in characters.txt, which
  their players asked for. It asks /characters.json on this same site, never the operations API itself. Change
  the names in <title> and <h1>, and the colour in the first line of <style>, to yours.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters of My World</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --accent: #8a5a1c; --ink: #1d1a16; --soft: #5d564c; --paper: #faf7f2; --line: #ddd5c8; }
    @media (prefers-color-scheme: dark) {
      :root { --accent: #e0b070; --ink: #ece6dc; --soft: #a79f92; --paper: #171512; --line: #37322b; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none; }
    body {
      margin: 0; padding: 3rem 1.25rem 4rem; background: var(--paper); color: var(--ink);
      font: 1.0625rem/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif;
    }
    main { max-width: 38rem; margin: 0 auto; }
    h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .4rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
    h2 { font: 600 .8rem/1.9 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
         margin: 2rem 0 .5rem; }
    .lead { color: var(--soft); font-size: 1.2rem; margin: 0 0 2rem; }
    .desc { white-space: pre-line; margin: 0 0 1rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1.5rem; margin: 0;
         padding-top: 1.25rem; border-top: 1px solid var(--line); }
    dt { font: 600 .8rem/1.9 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    dd { margin: 0; }
    ul.plain { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    ul.plain li { padding: .6rem 0; border-bottom: 1px solid var(--line); }
    .soft { color: var(--soft); font-size: .95rem; }
    .note { color: var(--soft); font-size: .95rem; margin-top: 1.5rem; }
    a { color: var(--accent); text-underline-offset: .15em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>My World</h1>
    <p class="lead">Characters</p>
    <ul class="plain" id="list" hidden></ul>
    <p class="note" id="note">Asking the server…</p>
    <noscript><p>This page needs JavaScript to ask the server for the list.</p></noscript>
    <p class="note"><a href="/">How to join</a></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function load() {
      try {
        const reply = await fetch('/characters.json');
        if (!reply.ok) throw new Error(reply.status);
        const { characters } = await reply.json();
        for (const c of characters) {
          const li = document.createElement('li'), a = document.createElement('a'), more = document.createElement('span');
          a.href = '/characters/' + c.slug; a.textContent = c.name;
          more.className = 'soft';
          more.textContent = ' · ' + [c.race, c.classes.map((k) => k.name + ' ' + k.level).join(' / ')].filter(Boolean).join(', ');
          li.append(a, more);
          $('list').append(li);
        }
        $('list').hidden = !characters.length;
        $('note').textContent = characters.length ? 'A character is here only when its player asked for a page.'
                                                  : 'No character has a page yet. A player can ask the team for one.';
      } catch (e) {
        $('note').textContent = 'The server isn’t answering. Please look again in a few minutes.';
      }
    }

    load();
  </script>
</body>
</html>
