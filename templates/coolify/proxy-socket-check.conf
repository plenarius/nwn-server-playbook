# A drop-in for docker.service: runs the proxy socket check 20 seconds after every Docker start, so a proxy
# left on an old socket by an upgrade is repaired straight away instead of at the timer's next minute.
# Install as /etc/systemd/system/docker.service.d/50-coolify-proxy-socket.conf. systemd-run starts the check
# on its own, so Docker's start never waits for it.
[Service]
ExecStartPost=-/usr/bin/systemd-run --no-block --on-active=20s --property=SyslogIdentifier=coolify-proxy-socket-check /usr/local/sbin/coolify-proxy-socket-check
