# Builds your fork of NWNX (nwnxee/unified) and publishes it as a container image on GitHub's registry (GHCR).
# Goes in your fork as .github/workflows/image.yml, with image.Dockerfile at the fork's top level.
#
# Every build of master gets two tags:
#   <commit>         seven characters of the commit, such as 3f9c2a1. Pushed once and never again: if the tag
#                    is already in the registry, this workflow stops instead of replacing it.
#   build<game>      such as build8193.37.17. Moves to each new build, for chapter 9's NWNX update.
# A pull request only compiles; nothing is published.
name: NWNX image

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docgen/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time, never cancelled, so two runs can't race for the same tag.
concurrency:
  group: nwnx-image
  cancel-in-progress: false

env:
  # Upstream's base image: the game server for your game build and the plugins' libraries, without NWNX.
  # Upstream rebuilds it about once a month under a commit tag; use the newest one for your game build.
  BASE_IMAGE: nwnxee/nwnxee-base:ed79330

jobs:
  build:
    runs-on: ubuntu-24.04
    # Upstream's builder image, pinned by digest so an upstream change can't change your build unseen.
    container: nwnxee/builder@sha256:94d9280fdc36f58c350d48e24a54e754c5b4ec7ea88b6aff1ab01ee2dfa4906f
    steps:
      - uses: actions/checkout@v4
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: Compile
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 400M
        run: |
          cmake -S . -B build -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4
          ccache -s
      - name: Pack
        if: github.event_name != 'pull_request'
        run: |
          (cd Binaries && tar cf ../NWNX-EE.tar .)
          find . -name 'nwnx_*.nss' -not -path './build/*' | grep -Pv '_t+[0-9]?\.nss$' | xargs zip -qj NWScript.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: nwnx
          path: |
            NWNX-EE.tar
            NWScript.zip
          retention-days: 30

  image:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nwnx
      - name: Names
        id: names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          build=$(sed -n 's/^set(TARGET_NWN_BUILD\(_REVISION\|_POSTFIX\)\? \([0-9]*\))$/\2/p' CMakeLists.txt | paste -sd.)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "moving=build$build" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to push a commit tag twice
        run: |
          ref="${{ steps.names.outputs.image }}:${{ steps.names.outputs.commit }}"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "::error::$ref is already in the registry. Commit tags are pushed once and never replaced."
            exit 1
          fi
          echo "$ref is new"
      - name: Build and push
        run: |
          image=${{ steps.names.outputs.image }}
          docker build -f image.Dockerfile --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:${{ steps.names.outputs.commit }}" -t "$image:${{ steps.names.outputs.moving }}" .
          docker push "$image:${{ steps.names.outputs.commit }}"
          docker push "$image:${{ steps.names.outputs.moving }}"
          {
            echo "### Published"
            echo "- \`$image:${{ steps.names.outputs.commit }}\` (never re-pushed)"
            echo "- \`$image:${{ steps.names.outputs.moving }}\` (moves with each build)"
            echo "- base: \`$BASE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
